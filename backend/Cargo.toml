[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.4"
tokio = { version = "1.36.0", features = ["full"] }

#serde
serde = { version = "1.0.197", features = ["derive"] }
serde_json = {version = "1.0.114"}

#env
dotenvy = "0.15.7"
reqwest = { version = "0.11.24", features = ["json"] }

tower-http = { version = "0.6.2", features = ["cors", "trace"] }
